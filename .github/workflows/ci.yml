name: ci

on:
    push:
        branches:
            - master
            - develop
            - ci
    pull_request:
        branches:
            - master

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    COMPOSER_NO_INTERACTION: "1"

jobs:
    audit:
        runs-on: ubuntu-latest
        name: "Audit | Runtime dependencies"
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: "none"
                  php-version: "8.1"
                  tools: composer:v2

            - name: Audit locked runtime dependencies
              run: composer audit --locked --no-dev

    phpunit:
        runs-on: ubuntu-latest
        name: "PHPUnit | PHP 8.4"
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: "none"
                  php-version: "8.4"
                  tools: composer:v2

            - name: Validate Composer files
              run: composer validate --strict

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.4-composer-
                      ${{ runner.os }}-php-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Run PHPUnit
              run: composer test -- --colors=never --log-junit "$RUNNER_TEMP/phpunit.xml"

            - name: Upload PHPUnit report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: phpunit-junit-php84
                  path: ${{ runner.temp }}/phpunit.xml
                  if-no-files-found: error

    phpstan:
        runs-on: ubuntu-latest
        name: "PHPStan | PHP 8.4"
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: "none"
                  php-version: "8.4"
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.4-composer-
                      ${{ runner.os }}-php-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Run PHPStan
              run: composer analyse -- --error-format=raw

    php-cs-fixer:
        runs-on: ubuntu-latest
        name: "php-cs-fixer | PHP 8.4"
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: "none"
                  php-version: "8.4"
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.4-composer-
                      ${{ runner.os }}-php-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Run php-cs-fixer
              run: composer php-cs-fixer
