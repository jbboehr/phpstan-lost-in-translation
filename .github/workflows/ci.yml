name: ci

on:
    push:
        branches:
            - master
            - develop
            - ci
    pull_request:
        branches:
            - master

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    COMPOSER_NO_INTERACTION: "1"

jobs:
    lint:
        runs-on: ubuntu-latest
        name: "Lint | PHP ${{ matrix.php-version }}"
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                php-version:
                    - "8.1"
                    - "8.2"
                    - "8.3"
                    - "8.4"
                    - "8.5"
        steps:
            - uses: actions/checkout@v6

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: "none"
                  php-version: "${{ matrix.php-version }}"
                  tools: composer:v2

            - name: Validate composer.json and composer.lock
              run: composer validate --strict

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v5
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress --ignore-platform-req=php+

            - name: phpcs
              run: composer phpcs

            - name: phpstan
              run: composer phpstan -- analyze

    test:
        runs-on: ubuntu-latest
        name: "Test | PHP ${{ matrix.php-version }} | Laravel ${{ matrix.laravel-version }}"
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - php-version: "8.1"
                      laravel-version: "9"
                    - php-version: "8.2"
                      laravel-version: "9"
                    - php-version: "8.1"
                      laravel-version: "10"
                    - php-version: "8.2"
                      laravel-version: "10"
                    - php-version: "8.3"
                      laravel-version: "10"
                    - php-version: "8.2"
                      laravel-version: "11"
                    - php-version: "8.3"
                      laravel-version: "11"
                    - php-version: "8.4"
                      laravel-version: "11"
                    - php-version: "8.5"
                      laravel-version: "11"
                    - php-version: "8.2"
                      laravel-version: "12"
                    - php-version: "8.3"
                      laravel-version: "12"
                    - php-version: "8.4"
                      laravel-version: "12"
                    - php-version: "8.5"
                      laravel-version: "12"
                    - php-version: "8.3"
                      laravel-version: "13"
                    - php-version: "8.4"
                      laravel-version: "13"
                    - php-version: "8.5"
                      laravel-version: "13"
        steps:
            - uses: actions/checkout@v6

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: "none"
                  php-version: "${{ matrix.php-version }}"
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v5
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-laravel-${{ matrix.laravel-version }}-composer-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-laravel-${{ matrix.laravel-version }}-composer-
                      ${{ runner.os }}-php-${{ matrix.php-version }}-composer-
                      ${{ runner.os }}-php-

            - name: Install Laravel
              run: composer require --no-update --dev --prefer-dist laravel/framework:^${{ matrix.laravel-version }}

            - name: Install dependencies
              run: composer update --no-progress --prefer-dist

            - name: Run test suite
              run: composer phpunit -- --no-coverage

            - name: Run e2e tests
              run: composer e2e

            - name: Run phpbench
              run: ./vendor/bin/phpbench run

    coverage:
        runs-on: ubuntu-latest
        name: "Coverage | PHP 8.4"
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v6

            - name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: pcov
                  php-version: "8.4"
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v5
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.4-composer-
                      ${{ runner.os }}-php-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Run test suite with coverage
              run: composer coverage

            - name: Upload coverage report
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-clover
                  path: clover.xml
                  if-no-files-found: error

    mutation:
        runs-on: ubuntu-latest
        name: "Mutation testing | PHP 8.4"
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6

            - name: Install PHP and Infection
              uses: shivammathur/setup-php@v2
              with:
                  coverage: pcov
                  php-version: "8.4"
                  tools: composer:v2, infection:0.34.2@sha256:ae83bc5151579817c3a6217eb3deceb86a169a399139264534218b723320da3d
              env:
                  fail-fast: true

            - name: Get Composer cache directory
              id: composer-cache-mutation
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v5
              with:
                  path: ${{ steps.composer-cache-mutation.outputs.dir }}
                  key: ${{ runner.os }}-php-8.4-composer-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.4-composer-
                      ${{ runner.os }}-php-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Run mutation baseline
              run: composer infection:ci

            - name: Upload mutation reports
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: infection-reports
                  path: |
                      infection.log
                      infection-summary.log
                  if-no-files-found: warn

    nix:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v6

            - uses: cachix/install-nix-action@v31

            - run: nix flake check -L
